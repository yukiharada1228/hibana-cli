name: Publish CLI
on:
  push:
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: cli-publish-${{ github.ref }}
  cancel-in-progress: false
jobs:
  test:
    uses: ./.github/workflows/ci.yml
  publish:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          registry-url: https://registry.npmjs.org
          cache: npm
      - name: Require matching immutable version
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: node -e 'const p=require("./package.json"); if(process.env.RELEASE_TAG!=="v"+p.version) throw Error("Tag/version mismatch")'
      - run: npm ci
      - run: npm pack --pack-destination .
      - name: Publish using npm trusted publishing
        shell: bash
        run: |
          version=$(node -p 'require("./package.json").version')
          npm publish "yukiharada1228-hibana-$version.tgz" --access public --provenance --tag latest
      - name: Publish reviewed package on GitHub
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        shell: bash
        run: |
          prerelease=()
          if [[ "$RELEASE_TAG" == *-* ]]; then prerelease=(--prerelease); fi
          gh release create "$RELEASE_TAG" --verify-tag --title "Hibana CLI $RELEASE_TAG" --generate-notes "${prerelease[@]}" ./*.tgz
