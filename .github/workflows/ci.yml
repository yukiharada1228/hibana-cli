name: CLI CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  workflow_call:
permissions:
  contents: read
concurrency:
  group: cli-ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      # npm test builds with tsc (including type checks) before running the suite.
      - run: npm test
      - name: Install tarball and build Hono with Node crypto
        run: npm run test:package
      - name: Create React SPA and build React + Hono + SQLite example from tarball
        run: npm run test:apps
      - run: npm audit --omit=dev --audit-level=high
